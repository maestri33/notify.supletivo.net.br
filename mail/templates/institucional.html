<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>{{title}}</title>
  <style>p{margin:0 0 16px}ul,ol{margin:0 0 16px;padding-left:22px}a{color:#012169}code{font-family:Consolas,monospace}</style>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:#172033">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6f8;padding:24px 12px">
    <tr><td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;background:#ffffff;border:1px solid #dfe3e8;border-radius:16px;overflow:hidden">
        <tr><td style="padding:28px 36px 24px;background:#012169;color:#ffffff">
          <div style="font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#ffdf00">Comunicação Institucional</div>
          <div style="margin-top:6px;font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#ffffff">Supletivo Brasil</div>
        </td></tr>
        <tr><td style="height:4px;background:#009c3b;font-size:0;line-height:0">&nbsp;</td></tr>
        <tr><td style="padding:36px 36px 24px">
          <h1 style="margin:0 0 18px;font-size:22px;line-height:1.3;color:#172033">{{title}}</h1>
          <div style="font-size:16px;line-height:1.65;color:#344054">{{content}}</div>
        </td></tr>
        <tr><td style="padding:24px 36px;background:#f8fafc;border-top:1px solid #e5e7eb;color:#667085;font-size:12px;line-height:1.6">
          <div>Supletivo Brasil — Educação de Jovens e Adultos.</div>
          <div>CNPJ 48.811.016/0001-00 · <a href="https://supletivo.net.br" target="_blank" style="color:#012169;text-decoration:none">supletivo.net.br</a></div>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
