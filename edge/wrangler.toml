name = "notify-edge"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "notify.supletivo.net.br", custom_domain = true }
]

[vars]
ENVIRONMENT = "production"
BACKEND_ORIGIN = "https://notify-backend.supletivo.net.br"

[[d1_databases]]
binding = "DB"
database_name = "notify-db"
database_id = "9f60bd23-8df1-4311-ad1f-7fc296bb0a49"

# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "notify-media"

[ai]
binding = "AI"

# ── Cloudflare Queues (Requer Workers Paid) ───────────────────
# [[queues.producers]]
# binding = "NOTIFY_QUEUE"
# queue = "notify-events"
# 
# [[queues.consumers]]
# queue = "notify-events"
# max_batch_size = 10
# max_retries = 3
# dead_letter_queue = "notify-events-dlq"

# ── Cloudflare Email Sending ────────────────────────────────
[[send_email]]
name = "EMAIL"

